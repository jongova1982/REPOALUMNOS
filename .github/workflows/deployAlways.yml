name: 🚀 Tarea de Despliegue

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🎉 Trabajo de Despliegue
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Obteniendo el código más reciente
        uses: actions/checkout@v4

      - name: 🔒 Verificando secretos del despliegue
        run: |
          test -n "${{ secrets.FTP_SERVER }}"
          test -n "${{ secrets.FTP_USER }}"
          test -n "${{ secrets.FTP_PASSWORD }}"
          test -n "${{ secrets.FTP_SERVER_DIR }}"

      - name: 📂 Sincronizando archivos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          timeout: 86400000
          log-level: standard
          exclude: |
            .git/**
            .github/**
            .env
            .env.*
            uploads/**
            **/*.log
            **/*.tmp
            **/*.bak


