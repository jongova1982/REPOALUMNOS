name: 🚀 Tarea de Despliegue

on:
   push:
     branches:
       - jongox

jobs:
  deploy:
    name: 🎉 Trabajo de Despliegue
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Obteniendo el código más reciente
        uses: actions/checkout@v4

      - name: 📂 Sincronizando archivos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOSTING }}
          username: ${{ secrets.FTP_USUARNAME }}
          password: ${{ secrets.FTP_PASSW }}
          server-dir: ${{ secrets.FTP_WWW }}
          protocol: ftps
          timeout: 86400000
          log-level: standard
          exclude: |
           .git/**
           .github/**


           

